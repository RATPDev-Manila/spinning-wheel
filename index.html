<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Philippines Railway Summit 2026 | Lucky Spin</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="brand-lockup">
      <img src="./assets/ratpdev-manila-logo.png" alt="RATP Dev Manila" class="brand-logo" />
      <div class="brand-divider" aria-hidden="true"></div>
      <h1 class="brand-event">Philippines Railway Summit 2026</h1>
    </div>
    <nav class="header-actions" aria-label="Kiosk controls">
      <button id="settingsBtn" type="button" aria-expanded="false" aria-controls="organizerPanel" class="header-button">
        Wheel Setup
      </button>
      <button id="manualResetBtn" type="button" class="header-button">
        Reset Screen
      </button>
    </nav>
  </header>

  <section id="organizerPanel" class="hidden settings-panel" aria-labelledby="organizerTitle">
    <div class="settings-card">
      <h2 id="organizerTitle" class="settings-title">Wheel Setup</h2>
      <div class="settings-divider">
        <h3 class="settings-subheading">Event results</h3>
        <div class="results-actions">
          <button id="exportCsvBtn" type="button" disabled class="header-button header-button--export">Download results CSV (0)</button>
        </div>
        <p id="entryManagementMessage" role="status" aria-live="polite" class="hidden entry-management-message"></p>
      </div>
      <div id="prizeRows" class="prize-rows"></div>
      <p id="settingsMessage" role="alert" class="hidden settings-message"></p>
      <p id="weightTotal" class="weight-total">Total chance: 100.00%</p>
      <div class="settings-actions">
        <button id="addPrizeBtn" type="button" class="header-button">Add prize</button>
        <button id="saveSettingsBtn" type="button" class="header-button header-button--export">Save settings</button>
        <button id="cancelSettingsBtn" type="button" class="header-button">Cancel</button>
      </div>
      <div class="settings-divider">
        <h3 class="settings-subheading">Browser-stored entries</h3>
        <button id="clearEntriesBtn" type="button" class="header-button clear-entry-button" disabled>Clear saved entries</button>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="page-main">

    <!-- Left: Spin Wheel -->
    <section class="wheel-column" aria-labelledby="wheelHeading">
      <h2 id="wheelHeading" class="wheel-heading">Spin to win</h2>
      <div>
        <div class="wheel-frame">
          <canvas id="wheelCanvas" width="700" height="700" role="img" aria-label="Prize wheel" class="wheel-canvas--idle"></canvas>
          <canvas id="wheelLabels" width="700" height="700" aria-hidden="true"></canvas>
          <div class="wheel-pointer" aria-hidden="true"></div>
          <img src="./assets/RoundRATPDev%20Logo.jpg" alt="" aria-hidden="true" class="wheel-center-logo" />
        </div>
      </div>
    </section>

    <!-- Prize list and result -->
    <aside class="prize-sidebar" aria-labelledby="attendeeTitle">
      <div id="participantFormSection">
        <h2 id="attendeeTitle" class="attendee-heading">Your details</h2>
        <p class="attendee-description">Enter your contact information to take part in the draw.</p>
        <form id="leadForm">
          <div class="attendee-fields">
            <div>
              <label for="inputName" class="field-label">Full name <span aria-hidden="true">*</span></label>
              <input type="text" id="inputName" required autocomplete="name" class="form-input" />
            </div>
            <div>
              <label for="inputEmail" class="field-label">Work email <span aria-hidden="true">*</span></label>
              <input type="email" id="inputEmail" required autocomplete="email" class="form-input" />
            </div>
            <div>
              <label for="inputCompany" class="field-label">Company or organization <span aria-hidden="true">*</span></label>
              <input type="text" id="inputCompany" required autocomplete="organization" class="form-input" />
            </div>
            <label for="inputConsent" class="consent-label">
              <input type="checkbox" id="inputConsent" />
              <span>I agree to receive RATP Dev updates and event follow-ups only.</span>
            </label>
          </div>
          <button type="submit" id="submitBtn" class="spin-button">
            Spin the wheel
          </button>
        </form>
      </div>
      <div id="resultSection" class="result-card hidden" aria-live="polite">
        <h2 class="result-title">You won</h2>
        <div id="prizeDisplay" class="result-prize"></div>
        <p class="result-countdown">Ready for the next participant in <span id="timerCount">12</span>s.</p>
      </div>
      <p id="storageMessage" role="alert" aria-live="polite" class="hidden storage-error"></p>
    </aside>
  </main>

  <footer class="site-footer">
    Philippines Railway Summit 2026
  </footer>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
